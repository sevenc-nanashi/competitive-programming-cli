[tools]
aube = { version = "latest", os = ["linux"] }
bat = { version = "latest", os = ["linux"] }
eza = { version = "latest", os = ["linux"] }
"github:EmbarkStudios/cargo-about" = "0.7.1"
"github:asciinema/agg" = { version = "latest", os = ["linux"] }
"github:asciinema/asciinema" = { version = "latest", os = ["linux"] }
node = { version = "24", os = ["linux"] }
ttyd = { version = "latest", os = ["linux"] }
usage = "latest"
vhs = { version = "0.10.0", os = ["linux"] }

[tasks.demo]
description = "Record the demo GIF and asciinema cast"
run = "ruby demo/record.rb"

[tasks.notice]
description = "Generate third-party license notices for the release binary"
run = "mkdir -p target && cargo about generate --locked --fail about.hbs --output-file target/notice.md"
