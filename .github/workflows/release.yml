name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Check version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/cpg dist/
          cp README.md LICENSE dist/
          tar -C dist -czf cpg-x86_64-unknown-linux-gnu.tar.gz cpg README.md LICENSE
          sha256sum cpg-x86_64-unknown-linux-gnu.tar.gz > cpg-x86_64-unknown-linux-gnu.tar.gz.sha256
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            cpg-x86_64-unknown-linux-gnu.tar.gz
            cpg-x86_64-unknown-linux-gnu.tar.gz.sha256
